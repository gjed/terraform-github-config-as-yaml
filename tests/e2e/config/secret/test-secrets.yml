# Organization-level secrets and variables for the e2e fixture.
# E2E_SECRET_VALUE is supplied through the e2e fixture's secret_values variable.

actions_secrets:
  E2E_ORG_SECRET:
    value: "env:E2E_SECRET_VALUE"  # pragma: allowlist secret
    visibility: selected
    selected_repositories:
      - e2e-oss-public
      - e2e-multi-group

actions_variables:
  E2E_ORG_VARIABLE:
    value: "e2e"
    visibility: all

dependabot_secrets:
  E2E_ORG_DEPENDABOT_SECRET:
    value: "env:E2E_SECRET_VALUE"  # pragma: allowlist secret
    visibility: private
