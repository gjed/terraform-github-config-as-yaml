# IMPORTANT: Must match github_org in terraform.tfvars — the module reads this
# value to configure org-scoped resources (settings, actions, webhooks).
#
# This is the dedicated test organization for this repository's CI. If you have
# forked this repo, change both this value and github_org in terraform.tfvars to
# your own throwaway org before running the fixture.
organization: gjed-io
subscription: free
is_organization: true

settings:
  billing_email: billing@example.com
  company: E2E Test Org
  blog: https://example.com
  email: admin@example.com
  location: Test City
  description: Throwaway org for e2e testing of terraform-github-config-as-yaml
  default_repository_permission: read
  members_can_create_repositories: true
  members_can_create_public_repositories: true
  members_can_create_private_repositories: true
  members_can_fork_private_repositories: false
  web_commit_signoff_required: false
  dependabot_alerts_enabled_for_new_repositories: true
  dependabot_security_updates_enabled_for_new_repositories: true
  dependency_graph_enabled_for_new_repositories: true

# allowed_actions is intentionally "all", not "selected", at the org level. GitHub
# unconditionally rejects (409) any repository-level actions/permissions/selected-actions
# request once the org itself uses "selected" — verified empirically against the live
# API, not inferred from docs. Repo-level restriction (restricted-actions-e2e group,
# e2e-actions-restricted repo below) exercises the module's more complex merge logic and
# is the higher-value path to cover in this fixture, so the org stays "all" to leave it
# unblocked. This still exercises github_actions_organization_permissions and the
# workflow-permissions resource below.
actions:
  enabled_repositories: all
  allowed_actions: all
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false

org_webhooks:
  - e2e-org-webhook

