# Custom property definitions for the e2e fixture.
# Custom properties are available on every subscription tier, so the fixture org creates them.
e2e_environment:
  description: "E2E deployment environment"
  value_type: single_select
  allowed_values:
    - development
    - production

e2e_tags:
  description: "E2E multi-select tags"
  value_type: multi_select
  allowed_values:
    - alpha
    - beta
    - gamma

e2e_owner:
  description: "E2E owning team"
  value_type: string
