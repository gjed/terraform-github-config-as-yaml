actions_secrets:
  lowercase_secret:  # pragma: allowlist secret
    value: "env:DEPLOY_TOKEN"  # pragma: allowlist secret
    visibility: all
  GITHUB_RESERVED:  # pragma: allowlist secret
    value: "env:DEPLOY_TOKEN"  # pragma: allowlist secret
    visibility: all
  MISSING_ENV_SECRET:  # pragma: allowlist secret
    value: "env:NOT_IN_SECRET_VALUES"  # pragma: allowlist secret
    visibility: all
  BAD_VISIBILITY_SECRET:  # pragma: allowlist secret
    value: "env:DEPLOY_TOKEN"  # pragma: allowlist secret
    visibility: public
  UNKNOWN_REPO_SECRET:  # pragma: allowlist secret
    value: "env:DEPLOY_TOKEN"  # pragma: allowlist secret
    visibility: selected
    selected_repositories:
      - does-not-exist
  NO_LIST_SECRET:  # pragma: allowlist secret
    value: "env:DEPLOY_TOKEN"  # pragma: allowlist secret
    visibility: selected

actions_variables:
  lowercase_variable:
    value: "x"
    visibility: all
  NO_LIST_VARIABLE:
    value: "x"
    visibility: selected

dependabot_secrets:
  MISSING_ENV_DEPENDABOT:  # pragma: allowlist secret
    value: "env:NOT_IN_SECRET_VALUES"  # pragma: allowlist secret
    visibility: private
