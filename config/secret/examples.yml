# Organization-level Actions and Dependabot secrets and Actions variables
#
# Every *.yml file in this directory is loaded in alphabetical order. Each file may define
# three optional top-level maps: actions_secrets, actions_variables, dependabot_secrets.
# Entries are merged PER TYPE by name across files (last file wins). Duplicate names are
# reported in the duplicate_key_warnings output.
#
# Names must match ^[A-Z_][A-Z0-9_]*$ and must not start with GITHUB_.
#
# Secret values use env:VAR_NAME and are read from the secret_values Terraform variable.
# Variable values are plaintext.
#
# visibility: all | private | selected
# selected_repositories: repository names managed by this module (required when visibility is selected)
#
# Example definitions (uncomment to use):

# actions_secrets:
#   DEPLOY_TOKEN:                          # pragma: allowlist secret
#     value: "env:DEPLOY_TOKEN"            # pragma: allowlist secret
#     visibility: selected
#     selected_repositories:
#       - my-app
#       - my-api

# actions_variables:
#   ENVIRONMENT:
#     value: "production"
#     visibility: all

# dependabot_secrets:
#   REGISTRY_PASSWORD:                     # pragma: allowlist secret
#     value: "env:REGISTRY_PASSWORD"       # pragma: allowlist secret
#     visibility: private
