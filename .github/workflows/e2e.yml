name: E2E

# Never runs on pull_request. This fixture creates and deletes real repositories
# and teams in a live organization, so it needs a token that can delete repos.
# Fork PRs cannot read secrets, and exposing that token to arbitrary workflow
# changes on a public repository is not acceptable. Manual dispatch and a nightly
# schedule on main only.
on:
  workflow_dispatch:
    inputs:
      skip_destroy:
        description: "Leave resources in place after the run (for debugging)"
        type: boolean
        default: false
  schedule:
    # 04:00 UTC daily
    - cron: "0 4 * * *"

permissions:
  contents: read

# The fixture owns the whole test organization. Two concurrent runs would fight
# over the same repositories, and a cancelled run would leave debris behind.
concurrency:
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Generous job budget. Individual steps carry their own timeouts so a hung
    # apply cannot consume the whole budget — a job-level timeout kills every
    # remaining step, including the always() destroy.
    timeout-minutes: 45
    # Gates the token behind an environment so it can carry protection rules and
    # is not readable by every workflow in the repository.
    environment: e2e
    env:
      GITHUB_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
      GITHUB_OWNER: ${{ vars.E2E_GITHUB_ORG }}
      TF_VAR_github_org: ${{ vars.E2E_GITHUB_ORG }}
      TF_IN_AUTOMATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail fast on missing configuration
        run: |
          missing=0
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "::error::secrets.E2E_GITHUB_TOKEN is not set on the 'e2e' environment."
            missing=1
          fi
          if [ -z "${GITHUB_OWNER}" ]; then
            echo "::error::vars.E2E_GITHUB_ORG is not set on the 'e2e' environment."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "Target organization: ${GITHUB_OWNER}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt

      - name: Install verification dependencies
        run: pip install -r tests/e2e/requirements.txt

      # State is local to the runner and dies with it. If a previous run was
      # cancelled, timed out, or used skip_destroy, its resources still exist in
      # the org with no state to describe them, and apply would fail forever with
      # 422 name-already-exists. The org is the state: every fixture resource is
      # e2e- prefixed, so removing them makes the run idempotent from any
      # starting condition.
      #
      # Hard-scoped to the e2e- prefix and to vars.E2E_GITHUB_ORG. Anything not
      # matching that prefix is never touched.
      - name: Sweep leftover fixture resources
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.E2E_GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          echo "Sweeping stale e2e-* resources from ${GITHUB_OWNER}"
          swept=0

          while read -r repo; do
            [ -n "$repo" ] || continue
            case "$repo" in
              e2e-*) ;;
              *) echo "  skip $repo (not e2e- prefixed)"; continue ;;
            esac
            echo "  deleting repo $repo"
            gh api -X DELETE "repos/${GITHUB_OWNER}/${repo}" --silent || {
              echo "::error::Failed to delete repo ${repo}. The token needs repository Administration (write)."
              exit 1
            }
            swept=$((swept + 1))
          done < <(gh api --paginate "orgs/${GITHUB_OWNER}/repos" -q '.[].name')

          while read -r slug; do
            [ -n "$slug" ] || continue
            case "$slug" in
              e2e-*) ;;
              *) echo "  skip team $slug (not e2e- prefixed)"; continue ;;
            esac
            echo "  deleting team $slug"
            gh api -X DELETE "orgs/${GITHUB_OWNER}/teams/${slug}" --silent || {
              echo "::error::Failed to delete team ${slug}. The token needs organization Members (write)."
              exit 1
            }
            swept=$((swept + 1))
          done < <(gh api --paginate "orgs/${GITHUB_OWNER}/teams" -q '.[].slug')

          # Org webhooks carry no name to prefix-match on, and this fixture is
          # the only thing that creates them in the test org.
          while read -r hook_id; do
            [ -n "$hook_id" ] || continue
            echo "  deleting org webhook $hook_id"
            gh api -X DELETE "orgs/${GITHUB_OWNER}/hooks/${hook_id}" --silent || {
              echo "::error::Failed to delete org webhook ${hook_id}. The token needs organization Webhooks (write)."
              exit 1
            }
            swept=$((swept + 1))
          done < <(gh api --paginate "orgs/${GITHUB_OWNER}/hooks" -q '.[].id')

          echo "Swept ${swept} leftover resource(s)."

      - name: Terraform init
        id: init
        timeout-minutes: 5
        working-directory: tests/e2e
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: tests/e2e
        run: terraform validate

      - name: Terraform plan
        timeout-minutes: 10
        working-directory: tests/e2e
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        timeout-minutes: 15
        working-directory: tests/e2e
        run: terraform apply -input=false tfplan

      - name: Verify against the GitHub API
        timeout-minutes: 5
        working-directory: tests/e2e
        run: |
          terraform output -json > /tmp/e2e_outputs.json
          python3 ../verify_e2e.py /tmp/e2e_outputs.json

      # Runs even when apply or verify fails, so a broken run does not leave
      # repositories and teams behind. Gated on init having succeeded: without
      # that, a failure before setup-terraform makes this step fail again with
      # 'terraform: command not found', burying the real error.
      #
      # Anything this misses is recovered by the sweep on the next run.
      - name: Terraform destroy
        if: always() && steps.init.outcome == 'success' && inputs.skip_destroy != true
        timeout-minutes: 15
        working-directory: tests/e2e
        run: terraform destroy -input=false -auto-approve

      - name: Warn when resources were intentionally left behind
        if: always() && steps.init.outcome == 'success' && inputs.skip_destroy == true
        run: |
          echo "::warning::skip_destroy was set — e2e resources remain in ${GITHUB_OWNER}. They will be swept on the next run."
