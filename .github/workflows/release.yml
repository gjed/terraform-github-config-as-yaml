name: Release

on:
  push:
    branches: [main]

permissions: {}

# Releases must not overlap. Two runs from closely spaced pushes would resolve
# the same prior tag and race to publish the same version. Queue instead of
# cancelling: a cancelled run would skip releasing its commits entirely.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Holds the release app credentials and only accepts runs from protected
    # branches, so a workflow on any other branch cannot mint the token.
    environment: release
    # GITHUB_TOKEN is only used to check out. Tags, releases and comments are
    # written with the release app token below.
    permissions:
      contents: read
    steps:
      # v* tags are protected by the gjed-release-tags ruleset (managed in
      # gjed/github-configs-public). Only admins and this app may create them;
      # the built-in GitHub Actions app cannot be a bypass actor on a personal
      # account, so GITHUB_TOKEN cannot push the tag.
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write # push the version tag and create the GitHub release
          permission-issues: write # comment on and label issues fixed by the release
          permission-pull-requests: write # comment on pull requests included in the release

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # semantic-release authenticates its own pushes from GITHUB_TOKEN, so
          # the token does not need to be left in .git/config.
          persist-credentials: false

      - name: Release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          # Neither commit-analyzer nor release-notes-generator bundles the
          # conventionalcommits preset - both depend only on
          # conventional-changelog-angular. Without this the run aborts with
          # MODULE_NOT_FOUND before creating a tag.
          #
          # Pinned to 9.x deliberately. Preset 10.x requires
          # conventional-changelog-writer >= 9, but semantic-release 25 resolves
          # writer ^8, so 10.x fails at note generation with
          # 'Missing helper'. Verified by dry-run: 9.3.1 + writer 8.4.0 works.
          extra_plugins: |
            conventional-changelog-conventionalcommits@9
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
