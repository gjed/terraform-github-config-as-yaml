name: CI

# Runs the repository's own quality gates on every pull request and on main.
# No secrets are used, so this is safe for fork PRs. The live-organization e2e
# fixture lives in e2e.yml and must never run from here.
#
# The job names `pre-commit` and `pytest` are an external contract: the ruleset
# that guards main (managed in a separate Terraform repository) requires them by
# name. Renaming a job strands every pull request waiting on the old name.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded pull request runs, but never a run on main. A shared group
# per ref is not enough: even with cancel-in-progress false, a third push to the
# same group replaces the pending second run. Pushes therefore get a group that
# is unique to the run, so every commit on main is checked.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # tests/e2e provisions real repositories and needs org credentials; it
      # runs from e2e.yml only.
      - name: Run unit tests
        run: pytest tests/ --ignore=tests/e2e

  terraform-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # mock_provider in tests/*.tftest.hcl needs Terraform 1.7 or later.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      # Plans run offline against mock_provider, so no provider credentials are set.
      - name: Init
        run: terraform init -backend=false

      - name: Run terraform test
        run: terraform test
